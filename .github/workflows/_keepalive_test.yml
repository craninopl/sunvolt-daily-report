name: Keepalive Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: keepalive — evita disabled_inactivity del cron"
          git push
