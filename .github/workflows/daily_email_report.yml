name: Daily Email Report

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar aunque el informe de hoy ya se haya enviado (salta el guard de idempotencia)"
        type: boolean
        required: false
        default: false
  schedule:
    # Los 3 crons son equivalentes: el guard de idempotencia del preflight decide
    # si se envia. El que llegue primero envia; los demas (y cualquier corrida
    # retrasada o manual sin force) se saltan.
    # 7:00 AM Colombia (UTC-5) = 12:00 UTC
    - cron: "0 12 * * *"
    # 8:00 AM Colombia = 13:00 UTC
    - cron: "0 13 * * *"
    # 9:00 AM Colombia = 14:00 UTC (2026-08-27: GitHub se salto AMBOS crons un dia entero)
    - cron: "0 14 * * *"

concurrency:
  group: daily-email-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Guard de idempotencia — incidente 2026-08-27: GitHub se salto los crons de la
  # manana (12:00 y 13:00 UTC), el informe se envio a mano (workflow_dispatch,
  # 18:54 UTC) y a las 21:31 UTC GitHub ejecuto con ~9h de retraso uno de los
  # crons saltados y DUPLICO el correo del dia. El preflight anterior decidia por
  # CUAL cron desperto la corrida (primario 12h = enviar siempre; 13h/14h =
  # retry), asi que una corrida retrasada del cron primario reenviaba, y ademas
  # su chequeo de retry solo miraba event=schedule (un envio MANUAL no contaba)
  # y la conclusion del WORKFLOW (una corrida con send-report skipped concluye
  # success igual). Este guard subsume esa distincion primario/retry: TODOS los
  # disparos (12h, 13h, 14h y manual sin force) pasan por la misma pregunta:
  # "¿ya hubo HOY (fecha America/Bogota) una corrida cuyo JOB send-report
  # concluyera success?" — si si, no se reenvia.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide if this run should send
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Override deliberado para reenvios: workflow_dispatch con force=true.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "force=true — se salta el guard de idempotencia (reenvio deliberado)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fecha del informe = HOY en America/Bogota. Los crons de 12:00-14:00 UTC
          # caen a las 7:00-9:00 a.m. del MISMO dia en Bogota; una corrida a las
          # 03:00 UTC seria las 10 p.m. de Bogota del dia ANTERIOR — por eso el
          # created_at de cada corrida se convierte a fecha Bogota antes de comparar.
          today=$(TZ=America/Bogota date +%F)

          # Historial reciente de ESTE workflow, cualquier trigger (un envio manual
          # TAMBIEN cuenta como "ya se envio hoy"). Si el API falla: fail-open
          # (proceder) — preferimos un posible duplicado a un dia sin informe.
          if ! runs=$(gh api "repos/${REPO}/actions/workflows/daily_email_report.yml/runs?per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.created_at)"'); then
            echo "WARN: no se pudo consultar el historial de corridas — se procede (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sent=""
          while IFS=' ' read -r run_id created_at; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            run_day=$(TZ=America/Bogota date -d "$created_at" +%F) || continue
            # La lista viene ordenada desc por created_at: al llegar a un dia
            # anterior a hoy (Bogota) ya no hay nada mas que mirar.
            [[ "$run_day" < "$today" ]] && break
            [ "$run_day" = "$today" ] || continue
            # Cuenta SOLO si el JOB send-report concluyo success: una corrida donde
            # send-report quedo skipped (este mismo guard) o fallo NO envio nada.
            # OJO: se busca el job por nombre — si se renombra el job, actualizar aqui.
            n=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=50" \
              --jq '[.jobs[] | select(.name == "send-report" and .conclusion == "success")] | length') || n=0
            if [ "${n:-0}" -gt 0 ]; then
              sent="run ${run_id} (created_at ${created_at})"
              break
            fi
          done <<< "$runs"

          if [ -n "$sent" ]; then
            echo "El informe de hoy ($today Bogota) ya se envio: $sent — corrida duplicada/retrasada, no se reenvia."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sin envio exitoso hoy ($today Bogota) — se procede a enviar."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  send-report:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send daily email report
        env:
          TZ: America/Bogota
          PYTHONUNBUFFERED: "1"
          PG_DSN: ${{ secrets.PG_DSN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: |
          python daily_email_report.py

      - name: Notify on failure
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRON_TYPE: ${{ github.event.schedule || 'manual' }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          run_url = os.environ["RUN_URL"]
          cron_type = os.environ["CRON_TYPE"]
          body = f"""SunVolt Daily Report fallo.

          Trigger: {cron_type}
          Run: {run_url}

          Revisa los logs. Si el cron de retry (13:00 UTC) tampoco funciona,
          puedes disparar manualmente con:
            gh workflow run daily_email_report.yml --repo craninopl/sunvolt-daily-report
          """
          msg = MIMEText(body)
          msg["Subject"] = "[ALERT] SunVolt Daily Report - workflow fallo"
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["SMTP_USER"]
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
              s.send_message(msg)
          print(f"Failure notification sent to {os.environ['SMTP_USER']}")
          PY

  # Evita que GitHub deshabilite el cron por inactividad (60 dias sin commits).
  # Ver: workflow quedo en 'disabled_inactivity' el 2026-08-16 y el reporte dejo de llegar.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch marker if repo has been idle > 20 days
        run: |
          set -e
          last=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          days=$(( (now - last) / 86400 ))
          echo "Ultimo commit hace ${days} dia(s)."
          if [ "$days" -lt 20 ]; then
            echo "Repo activo — no hace falta keepalive."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: keepalive — evita disabled_inactivity del cron"
          git push
